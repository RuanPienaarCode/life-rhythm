<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rhythm — preview</title>
<link rel="stylesheet" href="rhythm.css">
<style>
  html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #e9e8e4; }
  body.theme-dark { background: #0b0b0d; }
  /* Obsidian-ish host: buttons get its default chrome so the .rv-app
     overrides are exercised, not assumed. */
  button:not(.clickable-icon) { background: #f0f0f0; box-shadow: inset 0 0 0 1px #ccc; border: 0; border-radius: 6px; padding: 4px 12px; font-size: 14px; height: 30px; }
  .frame { position: absolute; inset: 24px; max-width: 900px; margin: 0 auto; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,.18); background: #fff; }
  body.narrow .frame { max-width: 390px; }
  .workspace-leaf-content, .view-content { height: 100%; }
  /* Obsidian paints the view ground itself at (0,2,0) — the plugin has to win this. */
  .workspace-leaf-content .view-content { background: #fff; color: #222; padding: 0 20px; }
  body.theme-dark .workspace-leaf-content .view-content { background: #1e1e1e; color: #ddd; }
  .stub-notice { position: fixed; top: 12px; right: 12px; background: #222; color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 13px; z-index: 50; }
  .stub-modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; }
  .stub-modal { position: fixed; top: 10vh; left: 50%; transform: translateX(-50%); width: min(520px, 92vw); background: #fff; border-radius: 16px; padding: 20px; z-index: 41; box-shadow: 0 16px 60px rgba(0,0,0,.3); }
  body.theme-dark .stub-modal { background: #1e1e21; }
  .stub-menu { position: fixed; z-index: 60; background: #fff; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.2); padding: 6px; display: flex; flex-direction: column; min-width: 160px; }
  .stub-menu button { text-align: left; background: transparent; box-shadow: none; padding: 8px 12px; border-radius: 6px; font-size: 14px; height: auto; }
  .stub-menu button:hover { background: #f0f0f0; }
  body.theme-dark .stub-menu { background: #2a2a2e; } body.theme-dark .stub-menu button { color: #eee; } body.theme-dark .stub-menu button:hover { background: #3a3a3e; }
  body.is-mobile-sim .frame { max-width: 390px; }
</style>
</head>
<body>
<div class="frame"><div class="workspace-leaf-content"><div id="app" class="view-content"></div></div></div>
<script>if (new URLSearchParams(location.search).get('narrow')) document.body.classList.add('narrow');</script>
<script src="bundle.js"></script>
</body>
</html>
